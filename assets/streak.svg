  <text x="79" y="128" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="600">Total Contributions</text>
  <text x="79" y="150" text-anchor="middle" fill="#8b949e" font-size="12">May 30 – Present</text>
</g>
<g transform="translate(235 86)">
